name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      # ไม่ติดตั้ง requirements-model.txt (torch) เทสต์ใช้ MODEL_BACKEND=fake
      - run: pip install -r services/api/requirements.txt
      - name: ruff
        working-directory: services/api
        run: ruff check .
      - name: pytest
        working-directory: services/api
        env:
          MODEL_BACKEND: fake
        run: python -m pytest -q

  eval-gold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r eval/requirements.txt
      - run: python eval/run.py --check-gold

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: build
        working-directory: apps/web
        run: |
          if [ ! -f package.json ]; then
            echo "ยังไม่มี apps/web/package.json ข้ามการ build"
            exit 0
          fi
          npm ci
          npm run build
          npm audit --audit-level=high --omit=dev

  no-ai-watermark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ตรวจข้อความ commit และ diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export LC_ALL=C
          # ใช้ pattern ชุดเดียวกับ git hook
          . scripts/hooks/watermark-patterns.sh
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-list --max-parents=0 "$HEAD" | tail -1)
          fi
          echo "ตรวจช่วง $BASE..$HEAD"
          fail=0
          if git log --format='%an <%ae>%n%B' "$BASE..$HEAD" | grep -iE "$WATERMARK_PATTERN"; then
            echo "::error::พบลายน้ำ AI ในข้อความ commit"
            fail=1
          fi
          # ยกเว้น .gitignore และไฟล์ hook เพราะต้องมีชื่อ/คำพวกนี้อยู่ในไฟล์ (docs/ISSUES.md ข้อ 7)
          if git diff "$BASE...$HEAD" -- . ':!.gitignore' ':!scripts/hooks/*' \
              | grep -E '^\+[^+]' | grep -iE "$WATERMARK_PATTERN"; then
            echo "::error::พบลายน้ำ AI ในไฟล์ที่เปลี่ยน"
            fail=1
          fi
          exit $fail
