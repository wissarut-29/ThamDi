[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E402: tests and preprocess.py add sys.path before import
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI ใช้ Depends/File ใน default ของพารามิเตอร์
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]
